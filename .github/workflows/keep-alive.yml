name: Keep-alive Render

# Ping les services Render toutes les 10 minutes pour éviter
# la mise en veille des instances gratuites (spin down ~15 min).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # permet de le tester manuellement

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping application principale
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              "https://patrimoine-app-bzw4.onrender.com/connexion")
            echo "patrimoine-app tentative $i : HTTP $code"
            [ "$code" = "200" ] && break
            sleep 20
          done

      - name: Ping service d'authentification
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              "https://patrimoine-auth.onrender.com/")
            echo "patrimoine-auth tentative $i : HTTP $code"
            [ "$code" = "200" ] && break
            sleep 20
          done
